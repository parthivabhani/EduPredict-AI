[project]
name = "edupredict-ai"
version = "1.0.0"
description = "EduPredict AI: Student Performance Prediction Web Application"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
]

[tool.vercel]
entrypoint = "web_app.server:app"
